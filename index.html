<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>king silvies unblocked ye</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">I love yeezy <span>i hate being ricci, it's awesome</span></div>
    </header>

    <div class="app-container">
        <!-- Navigation Sidebar -->
        <nav class="sidebar">
            <button class="nav-btn" data-filter="released">Released Discography</button>
            <button class="nav-btn" data-filter="unreleased">Unreleased</button>
        </nav>

        <!-- Main Track List -->
        <main class="content-area" id="trackList">
            <!-- Tracks are injected here by app.js -->
        </main>
    </div>

    <!-- Persistent Audio Player -->
    <footer class="player-bar">
        <div class="now-playing">
            <h3 id="currentTitle">SELECT A TRACK</h3>
            <p id="currentArtist">YE ARCHIVE</p>
        </div>

        <div class="controls">
            <div class="btn-group">
                <button class="ctrl-btn" id="prevBtn">⏮</button>
                <button class="ctrl-btn primary" id="playPauseBtn">▶</button>
                <button class="ctrl-btn" id="nextBtn">⏭</button>
            </div>
            <div class="progress-container">
                <span id="currentTime">0:00</span>
                <input type="range" id="seekBar" value="0" min="0" max="100" step="0.1">
                <span id="duration">0:00</span>
            </div>
        </div>
    </footer>

    <!-- Hidden Audio Engine -->
    <audio id="audioPlayer"></audio>

    <script src="app.js"></script>
</body>
</html>
